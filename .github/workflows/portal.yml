# The portal (portal/): the private names check, its tests and its build, on every push
# and pull request that touches it, plus, on the cloud's side, the inventory contract, the
# status API (scripts/tests/portal-api.sh), the role the portal gives each Authentik group and
# the MCP gateway (scripts/tests/mcp-gateway.sh) and adopting an existing app from a laptop
# (scripts/tests/ihc-app-init.sh), and `install.sh handoff` repeating the web terminal's key
# command (scripts/tests/handoff-wetty-key.sh), and env_secret working in a stage that runs
# without stage_secrets (scripts/tests/install-env-secret.sh), and the deploy journal with
# rollback's refusals and apply's merged-commit gate (scripts/tests/deploy-journal.sh).
# CI only: the portal is deployed by the installer (install.sh, stage portal).
name: portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: private names
        run: scripts/check-private-names.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: inventory contract (cloud side)
        working-directory: .
        run: scripts/tests/inventory-contract.sh
      - name: status API (cloud side)
        working-directory: .
        run: scripts/tests/portal-api.sh
      - name: role from the Authentik groups
        working-directory: .
        run: scripts/tests/portal-roles.sh
      - name: MCP gateway (actor JWT, routing, fallback, cloud side)
        working-directory: .
        run: scripts/tests/mcp-gateway.sh
      - name: copy_portal leaves a tree the image's node user can read
        working-directory: .
        run: scripts/tests/copy-portal-perms.sh
      - name: ihc-app init, an existing app adopted from a laptop (fake Gitea)
        working-directory: .
        run: scripts/tests/ihc-app-init.sh
      - name: install.sh handoff repeats the web terminal's key command while it is needed
        working-directory: .
        run: scripts/tests/handoff-wetty-key.sh
      - name: env_secret in a stage run without stage_secrets (the upgrade path, --from foundation)
        working-directory: .
        run: scripts/tests/install-env-secret.sh
      - name: deploy journal, rollback's refusals and apply's merged-commit gate (fake Gitea)
        working-directory: .
        run: scripts/tests/deploy-journal.sh
      - name: secrets proxy private caller provisioning (offline)
        working-directory: .
        run: scripts/tests/secrets-proxy.sh
      - name: app trust boundary lint and doctor warnings
        working-directory: .
        run: scripts/tests/ihc-app-lint.sh
      - name: edge ingress DNS and proxy headers (offline)
        working-directory: .
        run: scripts/tests/edge-ingress.sh
      - name: optional iht source (offline config, blueprint and stubbed Authentik)
        working-directory: .
        run: scripts/tests/iht-sso.sh
      - name: installer login claim (loopback HTTP, no Docker)
        working-directory: .
        run: bash scripts/tests/iht-claim.sh
      - name: installer login claim (offline persistence)
        working-directory: .
        run: bash scripts/tests/iht-claim-offline.sh
