# Runs the same way on a laptop (`docker compose up --build`) and on the box. On the box
# the deploy adds <install-dir>/apps/<slug>/compose.occ.yml on top: the cloud
# network, the env file written by occ-app provision, no published host port.
# Never add postgres, redis or object storage services here: the cloud provides them.
services:
  app:
    build: .
    env_file:
      - ${COMPANY_ENV_FILE:-.env}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
