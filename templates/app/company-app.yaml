# The app's operational contract (docs/app-contract.md, schemas/company-app.schema.json).
# harness-app provision reads it on every push to main.
schema_version: 1

app:
  slug: __APP_SLUG__
  name: __APP_NAME__
  owner_email: __OWNER_EMAIL__
  description: Internal app built on the company cloud.

runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: app
  port: 8080
  healthcheck:
    type: http
    path: /health
    expected_status: 200

deploy:
  enabled: true
  domain: __APP_DOMAIN__
  port: auto
  env_example: .env.example

auth:
  required: true
  provider: forward-auth

database:
  required: true
  engine: postgres

dependencies:
  redis:
    required: true

# Files (uploads, exports): set true for a bucket of the app's own on the shared S3 storage
# (the harness's storage profile must be on). The deploy writes S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION into the app's env (README.md, "Files").
object_storage:
  required: false

checks:
  build_command: docker compose build
  test_command: npm test
