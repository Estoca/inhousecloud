# Push to main is the deploy (docs/gitops-flow.md). The job runs on the box, on the
# runner labelled harness-deploy, inside the harness deployer image: it has the Docker
# socket, the harness network and the install directory (HARNESS_INSTALL_DIR).
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-__APP_SLUG__

jobs:
  deploy:
    runs-on: harness-deploy
    timeout-minutes: 20
    env:
      APP_SLUG: __APP_SLUG__
    steps:
      - name: Check out the pushed commit
        env:
          HARNESS_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: harness-app checkout

      - name: Provision database, Redis, env file, route and SSO
        run: harness-app provision "$APP_SLUG"

      - name: Build and start on the harness network
        run: |
          COMPANY_ENV_FILE="$HARNESS_INSTALL_DIR/apps/$APP_SLUG/.env" \
          docker compose -p "$APP_SLUG" \
            -f docker-compose.yml \
            -f "$HARNESS_INSTALL_DIR/apps/$APP_SLUG/compose.harness.yml" \
            up -d --build --remove-orphans

      - name: Wait for the healthcheck in company-app.yaml
        run: harness-app wait "$APP_SLUG" --timeout 240
