# Push to main is the deploy (docs/gitops-flow.md). The job runs on the box, on the
# runner labelled ihc-deploy, inside the cloud deployer image: it has the Docker
# socket, the ihc network and the install directory (IHC_INSTALL_DIR).
#
# Two steps: `build` turns the commit into a release (its files and images; no cloud
# credentials, nothing that runs changes), `apply` puts that release on the air under the
# app's lock, only when the commit is the head of main, recording what it changes in the
# deploy journal first. A bad release is undone on the box with `ihc-app rollback <slug>`.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-__APP_SLUG__

jobs:
  deploy:
    runs-on: ihc-deploy
    timeout-minutes: 20
    env:
      APP_SLUG: __APP_SLUG__
    steps:
      - name: Check out the pushed commit
        env:
          IHC_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ihc-app checkout

      - name: Lint the app trust boundary
        run: ihc-app lint

      - name: Build the release (the commit's files and images)
        run: ihc-app build "$APP_SLUG"

      - name: Apply it (lock, merged commits only, journal, provision, start, healthcheck)
        run: ihc-app apply "$APP_SLUG" --timeout 240
