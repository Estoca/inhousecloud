# InHouseCloud: the single-box company cloud as Compose profiles.
#
# Every value comes from .env (see .env.example); install.sh generates that file.
# Services with no `profiles:` key are the `core` profile and always run.
# Optional profiles are enabled through COMPOSE_PROFILES in .env:
#   storage      Garage (S3-compatible object storage for apps)
#   ops          admin tools: Portainer, Glances, Wetty (web terminal), FileBrowser
#   cloudflared  Cloudflare Tunnel (ingress public + tls edge/acme)
#   tailscale    Tailscale node and its split-DNS server (ingress private)
#   backup       the backup job (on when BACKUP_ENABLED=true; docs/backup.md)
#   agent        the operator agent (docs/operator-contract.md); the read-only Docker API
#                it uses, docker-ro, is core (the portal uses it too)
# The Gitea Actions runners (gitea-runner, gitea-deployer) are core: push to main deploys.
# A leftover `ci` in COMPOSE_PROFILES selects nothing and does no harm.
#
# Rules (docs/install-design.md):
#   - Authentik keeps its own Postgres; identity never depends on app data.
#   - The shared Postgres and Redis exist for apps built inside the cloud.
#   - Only the proxy, the Gitea SSH port and loopback control ports are published. In
#     `private` ingress everything is published on 127.0.0.1 and the tailnet reaches the
#     proxy only through the Tailscale node's serve config (ports 80, 443, Gitea SSH).
#   - Named volumes only, except the ops tools' explicit host paths (docs/security.md).
#   - One internal network (ihc), joinable by apps. The ops tools live on a second
#     network (ihc-ops) that only the proxy joins: an app container cannot reach them
#     without going through the proxy and the SSO.

name: ${COMPOSE_PROJECT_NAME:-ihc}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------ core
  proxy:
    image: ${PROXY_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISABLE_IPV6: "true"
      INITIAL_ADMIN_EMAIL: ${PROXY_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${PROXY_ADMIN_PASSWORD}
    ports:
      - "${BIND_ADDRESS}:${PROXY_HTTP_PORT}:80"
      - "${BIND_ADDRESS}:${PROXY_HTTPS_PORT}:443"
      - "127.0.0.1:${PROXY_ADMIN_PORT}:81"
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt
    networks:
      ihc:
        aliases:
          # Containers resolve the public hostnames to the proxy, so Gitea can
          # fetch Authentik's OIDC discovery document by its public URL.
          - ${PORTAL_HOST}
          - ${AUTHENTIK_HOST}
          - ${GITEA_HOST}
      ops: {}
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  authentik-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${AUTHENTIK_PG_DB}
      POSTGRES_USER: ${AUTHENTIK_PG_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD}
    volumes:
      - authentik-postgres-data:/var/lib/postgresql/data
    networks: [ihc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  authentik-server:
    image: ${AUTHENTIK_IMAGE}
    command: server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    ports:
      # Loopback only: the installer's control-plane path. Users go through the proxy.
      - "127.0.0.1:${AUTHENTIK_LOCAL_PORT}:9000"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    networks: [ihc]
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  authentik-worker:
    image: ${AUTHENTIK_IMAGE}
    command: worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
    networks: [ihc]
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  postgres:
    # Shared Postgres: for apps built inside the cloud, plus the portal's and Gitea's
    # own databases, each with its own role. Authentik keeps a separate instance.
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [ihc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    # Shared Redis: for apps built inside the cloud. Each app gets an ACL user limited to
    # its key prefix (scripts/ihc-app.sh); users persist in /data/users.acl.
    image: ${REDIS_IMAGE}
    command: ["sh", "-c", "touch /data/users.acl && exec redis-server --save 60 1 --loglevel warning --aclfile /data/users.acl"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks: [ihc]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  gitea:
    # Gitea's own database and role live on the shared Postgres instance
    # (created by install.sh in the shared_data stage), as the first box runs it.
    image: ${GITEA_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__database__SSL_MODE: disable
      GITEA__server__ROOT_URL: ${GITEA_BASE_URL}/
      GITEA__server__DOMAIN: ${GITEA_HOST}
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN_VIEW}
      GITEA__service__ENABLE_NOTIFY_MAIL: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__oauth2_client__UPDATE_AVATAR: "false"
      GITEA__actions__ENABLED: ${GITEA_ENABLE_ACTIONS}
      GITEA__mailer__ENABLED: "false"
      GITEA__log__LEVEL: Info
      # TLS internal: Go reads every file of these directories as trusted roots, so Gitea
      # trusts the cloud CA when it talks to https://auth.<BASE_DOMAIN> (OIDC). The file is
      # empty when TLS is not internal.
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ihc-ca
    ports:
      - "${BIND_ADDRESS}:${GITEA_SSH_PORT}:22"
      # Loopback only: the installer's control-plane path. Users go through the proxy.
      - "127.0.0.1:${GITEA_LOCAL_PORT}:3000"
    volumes:
      - gitea-data:/data
      - ./local/ca/ca.crt:/etc/ihc-ca/ca.crt:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks: [ihc]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  portal:
    # The app portal (portal/ of this repository, portal/README.md): catalog, state of each
    # app, deploys and the platform status, read only. install.sh copies portal/ into
    # PORTAL_BUILD_CONTEXT and builds it; the container applies its own migrations to its
    # database on the shared Postgres at boot. It reads:
    #   the inventory        <install-dir>/catalog/ mounted read only (never the install
    #                        directory, its .env or the apps' env files)
    #   the backup status    <BACKUP_DESTINATION>/reports, read only
    #   Docker               through docker-ro on its own internal network, never the socket
    #   apps and routes      through the proxy with the app's Host header, as ihc doctor does
    #   Gitea                with the read-only token; the proxy, Garage: health only
    #   Authentik            health, and users and groups with the token of the read-only
    #                        service account ihc-portal (AUTHENTIK_PORTAL_TOKEN, first-run)
    # Who the person is comes from the forward auth headers, trusted only from the proxy;
    # admin is the AUTHENTIK_PORTAL_GROUP group, viewer the AUTHENTIK_APP_GROUP group.
    build:
      context: ${PORTAL_BUILD_CONTEXT}
    image: ${COMPOSE_PROJECT_NAME:-ihc}-portal:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-ro:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      PUBLIC_BASE_URL: ${PORTAL_BASE_URL}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL}
      PORTAL_HOST: ${PORTAL_HOST}
      BASE_DOMAIN: ${BASE_DOMAIN}
      DATABASE_URL: postgres://${PORTAL_DB_ROLE}:${PORTAL_DB_PASSWORD}@postgres:5432/${PORTAL_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      SUPER_ADMIN_EMAILS: ${PORTAL_SUPER_ADMIN_EMAILS}
      ADMIN_GROUP: ${AUTHENTIK_PORTAL_GROUP:-ihc-admins}
      USER_GROUP: ${AUTHENTIK_APP_GROUP:-ihc-users}
      PORTAL_ALLOW_DOMAIN_USERS: "false"
      TRUSTED_PROXY_HOSTS: proxy
      # Read-only bearer for GET /api/platform/status (docs/portal-api.md); first-run makes it.
      IHC_PORTAL_API_TOKEN: ${IHC_PORTAL_API_TOKEN:-}
      INVENTORY_PATH: /ihc/catalog/inventory.json
      PORTAL_MANIFEST_PATH: /app/company-app.yaml
      IHC_PROXY_URL: http://proxy:80
      NPM_HEALTH_URL: http://proxy:81/api/
      DOCKER_HOST: tcp://docker-ro:2375
      IHC_PROJECT: ${COMPOSE_PROJECT_NAME:-ihc}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      INGRESS: ${INGRESS:-local}
      TUNNEL_PROVIDER: ${TUNNEL_PROVIDER:-none}
      GITEA_URL: http://gitea:3000
      GITEA_PUBLIC_URL: ${GITEA_BASE_URL}
      GITEA_ORG: ${GITEA_ORGANIZATION}
      GITEA_TOKEN: ${GITEA_READONLY_TOKEN:-}
      AUTHENTIK_URL: ${AUTHENTIK_BASE_URL}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST}
      AUTHENTIK_INTERNAL_URL: http://authentik-server:9000
      AUTHENTIK_PORTAL_TOKEN: ${AUTHENTIK_PORTAL_TOKEN:-}
      GARAGE_HEALTH_URL: http://garage:3903/health
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_REPORTS_DIR: /ihc/backup-reports
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      TIMEZONE: ${BACKUP_TZ:-UTC}
    volumes:
      - ./catalog:/ihc/catalog:ro
      - ${PORTAL_BACKUP_REPORTS_DIR:-./backups/reports}:/ihc/backup-reports:ro
    networks: [ihc, docker]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  docker-ro:
    # The Docker API, read only (docker/agent/docker-ro-proxy.py, docs/security.md): GET on
    # an allowlist, Env as names only, logs and stats never stream. The portal and the
    # operator agent read Docker through it and never get the socket. It sits on two
    # internal networks, `docker` (the portal) and `agent` (the agent, which knows it as
    # agent-docker-proxy); apps join neither. Writes (restart of an app container, build
    # cache prune) exist only with ops.agent.allow_write and only for the agent container.
    image: ${AGENT_PROXY_IMAGE:-python:3.13-alpine}
    command: ["python3", "-I", "/app/docker-ro-proxy.py"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      IHC_PROJECT: ${COMPOSE_PROJECT_NAME:-ihc}
      AGENT_ALLOW_WRITE: ${AGENT_ALLOW_WRITE:-false}
      WRITE_CLIENTS: agent
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./docker-ro:/app:ro
    networks:
      docker: {}
      agent:
        aliases: [agent-docker-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2375/_ping',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --------------------------------------------------------------- storage
  garage:
    # S3 API on garage:3900 for apps, s3.<BASE_DOMAIN> through the proxy. No console:
    # Garage has none. The admin API (3903) answers only with GARAGE_ADMIN_TOKEN and is
    # not routed. install.sh renders ./garage/garage.toml (no secrets in it) and applies
    # the single-node layout; ihc-app provision creates one bucket and key per app.
    profiles: ["storage"]
    image: ${GARAGE_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      RUST_LOG: ${GARAGE_LOG_LEVEL:-garage=info}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks: [ihc]
    healthcheck:
      # The image has no shell: the node answering its own RPC is "healthy". Whether the
      # layout gives it storage is `garage health`, checked by install.sh and smoke test 19.
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # ------------------------------------------------------------ runners (core)
  # Two runners on purpose (docs/gitops-flow.md). Both daemons need the Docker socket to
  # start job containers; only the deployer hands it to its jobs.
  gitea-runner:
    # CI for any repository: label ubuntu-latest. Jobs get no Docker socket, no ihc
    # network and no install directory (runner/ci.yaml).
    image: ${GITEA_RUNNER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS}
      CONFIG_FILE: /config/ci.yaml
    volumes:
      - gitea-runner-data:/data
      - ./runner:/config:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [ihc]
    healthcheck:
      # Liveness of the daemon; registration is recorded in /data/.runner.
      test: ["CMD-SHELL", "pgrep act_runner >/dev/null && test -f /data/.runner"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  gitea-deployer:
    # Deploys: label ihc-deploy, registered for the organization only. Its jobs run in
    # the <project>-deployer:local image with the Docker socket, the ihc network and
    # the install directory: a job here is root on the box (runner/deploy.yaml).
    image: ${GITEA_RUNNER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_DEPLOY_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME}-deploy
      GITEA_RUNNER_LABELS: ihc-deploy
      CONFIG_FILE: /config/deploy.yaml
    volumes:
      - gitea-deployer-data:/data
      - ./runner:/config:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [ihc]
    healthcheck:
      test: ["CMD-SHELL", "pgrep act_runner >/dev/null && test -f /data/.runner"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------- ops
  # Admin tools, reachable only through the proxy with forward auth bound to the
  # ihc-admins group (scripts/first-run.sh). They sit on the ops network, which apps
  # never join, so the SSO in front of them cannot be bypassed from an app container.
  # Each one is admin access to the machine: docs/security.md.
  portainer:
    profiles: ["ops"]
    image: ${PORTAINER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - portainer-data:/data
    networks: [ops]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  glances:
    profiles: ["ops"]
    image: ${GLANCES_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    pid: host
    environment:
      GLANCES_OPT: "-w"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    networks: [ops]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:61208/api/4/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  wetty:
    # Web terminal at terminal.<BASE_DOMAIN>: a shell on the HOST, not in a container.
    # Wetty runs ssh to the host's sshd (host.docker.internal, or the host's address when
    # that does not answer) as WETTY_SSH_USER, with the dedicated key install.sh writes to
    # <install-dir>/local/wetty/ (key only, no password prompt; host key pinned in
    # known_hosts). Installed only when the host runs sshd; never fails the install.
    profiles: ["ops"]
    image: ${WETTY_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    command:
      - --base=/
      - --port=3000
      - --ssh-host=${WETTY_SSH_HOST:-host.docker.internal}
      - --ssh-port=${WETTY_SSH_PORT:-22}
      - --ssh-user=${WETTY_SSH_USER:-}
      - --ssh-auth=publickey
      - --ssh-key=/keys/id_ed25519
      - --known-hosts=/keys/known_hosts
      - --force-ssh
      - --allowed-origin=${WETTY_ORIGIN:-http://localhost}
      - --title=${COMPOSE_PROJECT_NAME:-ihc}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WETTY_KEY_DIR:-./local/wetty}:/keys:ro
    networks: [ops]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  filebrowser:
    # File manager at files.<BASE_DOMAIN>. It sees exactly two host paths and nothing
    # else (docs/security.md; tested by scripts/tests/ops-mounts.sh):
    #   /srv/apps            <install-dir>/app-data: one directory per app, mounted at
    #                        /data in the app (scripts/ihc-app.sh)
    #   /srv/backup-reports  <BACKUP_DESTINATION>/reports, read only
    # Never the install directory itself, its .env, local/ or the apps' env files.
    # Its own login is off: auth.method=proxy trusts X-authentik-username, which only the
    # proxy (the one other member of the ops network) sets after forward auth. No admin
    # account or password exists; each SSO user gets a non-admin FileBrowser user.
    profiles: ["ops"]
    image: ${FILEBROWSER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    # Root in the container (with only the file capabilities) so it can read the app
    # directories, which are owned by the host user (rootless Docker: container root is
    # that user) or by the apps' container user.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        db=/database/filebrowser.db
        [ -f "$$db" ] || filebrowser config init -d "$$db" >/dev/null
        filebrowser config set -d "$$db" --root /srv --address 0.0.0.0 --port 80 \
          --auth.method=proxy --auth.header=X-authentik-username >/dev/null
        exec filebrowser -d "$$db"
    volumes:
      - filebrowser-db:/database
      - ${FILEBROWSER_APP_DATA_DIR:-./app-data}:/srv/apps
      - ${FILEBROWSER_REPORTS_DIR:-./backups/reports}:/srv/backup-reports:ro
    networks: [ops]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- ingress
  cloudflared:
    profiles: ["cloudflared"]
    image: ${CLOUDFLARED_IMAGE}
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    networks: [ihc]
    healthcheck:
      # The image has no shell; this checks the binary answers, not the tunnel state.
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  tailscale:
    # The box's node on the tailnet (ingress private, docs/install-design.md). Userspace
    # networking in its own network namespace: the tailnet reaches only what
    # ./tailscale/serve.json forwards (80 and 443 to the proxy, the Gitea SSH port to
    # Gitea) and the DNS server below; nothing else of the box. The auth key reaches the
    # container only for the first login (install.sh passes it from the environment and
    # recreates the container without it); the node then lives on its state volume.
    profiles: ["tailscale"]
    image: ${TAILSCALE_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    hostname: ${TAILSCALE_HOSTNAME}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks: [ihc]
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\": \"Running\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  tailnet-dns:
    # Split DNS for BASE_DOMAIN: answers every *.<BASE_DOMAIN> with the node's tailnet
    # address. Lives in the Tailscale node's network namespace, bound to its loopback,
    # where the node delivers DNS sent to <tailnet address>:53. install.sh renders
    # ./tailscale/Corefile once the address is known.
    profiles: ["tailscale"]
    image: ${COREDNS_IMAGE}
    command: ["-conf", "/config/Corefile"]
    restart: unless-stopped
    logging: *default-logging
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
    volumes:
      - ./tailscale:/config:ro

  # ---------------------------------------------------------------- backup
  backup:
    # The minimal backup job (docs/backup.md): busybox crond runs ihc-backup on
    # BACKUP_SCHEDULE. Dumps stream from pg_dump into a restic repository encrypted with
    # BACKUP_ENCRYPTION_KEY under BACKUP_DESTINATION; volumes and the install directory
    # are mounted read-only. install.sh assembles the build context in ./backup-job.
    profiles: ["backup"]
    build:
      context: ${BACKUP_BUILD_CONTEXT:-./backup-job}
      args:
        PG_CLIENT: ${BACKUP_PG_CLIENT_PACKAGE:-postgresql16-client}
    image: ${COMPOSE_PROJECT_NAME:-ihc}-backup:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_MAX_RUN_MINUTES: ${BACKUP_MAX_RUN_MINUTES}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY}
      RESTIC_PASSWORD: ${BACKUP_ENCRYPTION_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_PG_USER: ${AUTHENTIK_PG_USER}
      AUTHENTIK_PG_PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - ${BACKUP_DESTINATION}:/backups
      - .:/ihc:ro
      - backup-cache:/var/cache/restic
      - gitea-data:/volumes/gitea-data:ro
      - proxy-data:/volumes/proxy-data:ro
      - proxy-letsencrypt:/volumes/proxy-letsencrypt:ro
      - authentik-media:/volumes/authentik-media:ro
      - authentik-templates:/volumes/authentik-templates:ro
      - authentik-certs:/volumes/authentik-certs:ro
      - garage-data:/volumes/garage-data:ro
    networks: [ihc]
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------- agent
  # The operator agent (docs/operator-contract.md, docs/security.md), off unless the
  # `agent` profile is on. Reference implementation: OpenClaw. It reads the Docker API
  # through docker-ro only (core; GET allowlist, Env as names only; writes only with
  # ops.agent.allow_write), never the socket, the install directory or its .env. Its LLM
  # key and chat tokens are AGENT_* variables a human puts in .env.
  agent:
    profiles: ["agent"]
    image: ${OPENCLAW_IMAGE:-openclaw/openclaw:latest}
    # The gateway listens on the container's loopback only: no port, no route. People
    # reach the agent through the chat channel; the admin through `docker compose exec`.
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18789"]
    user: ${AGENT_USER:-1000:1000}
    init: true
    # A limit of its own: past it the kernel kills the agent, not a core service.
    mem_limit: ${AGENT_MEM_LIMIT:-3g}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      docker-ro:
        condition: service_healthy
    environment:
      HOME: /agent/state/home
      OPENCLAW_HOME: /agent/state/home
      OPENCLAW_STATE_DIR: /agent/state
      OPENCLAW_CONFIG_PATH: /agent/state/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /agent/workspace
      OPENCLAW_NO_RESPAWN: "1"
      NODE_COMPILE_CACHE: /agent/state/compile-cache
      # V8 collects before the container limit, instead of growing toward it.
      NODE_OPTIONS: --max-old-space-size=${AGENT_NODE_HEAP_MB:-1024}
      PATH: /agent/workspace/reference/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TZ: ${AGENT_TZ:-UTC}
      ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      SLACK_BOT_TOKEN: ${AGENT_SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${AGENT_SLACK_APP_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${AGENT_TELEGRAM_BOT_TOKEN:-}
      GITEA_READONLY_TOKEN: ${GITEA_READONLY_TOKEN:-}
      AGENT_GITEA_TOKEN: ${AGENT_GITEA_TOKEN:-}
      IHC_DOCKER_API: http://agent-docker-proxy:2375
      IHC_AGENT_ALLOW_WRITE: ${AGENT_ALLOW_WRITE:-false}
      IHC_GITEA_URL: http://gitea:3000
      IHC_BACKUP_REPORTS: /ihc/backup-reports
      IHC_BASE_DOMAIN: ${BASE_DOMAIN:-}
    volumes:
      - ${AGENT_DIR:-./agent}/state:/agent/state
      - ${AGENT_DIR:-./agent}/workspace:/agent/workspace
      - ${AGENT_DIR:-./agent}/reference:/agent/workspace/reference:ro
      - ${AGENT_BACKUP_REPORTS_DIR:-./backups/reports}:/ihc/backup-reports:ro
    networks: [ihc, agent]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  ihc:
    name: ${IHC_NETWORK}
  ops:
    # Ops tools and the proxy only. Not internal: Wetty needs the route to the host's sshd.
    name: ${IHC_OPS_NETWORK:-ihc-ops}
  agent:
    # The agent and the read-only Docker API only. Internal: the proxy has no way out.
    name: ${IHC_AGENT_NETWORK:-ihc-agent}
    internal: true
  docker:
    # The portal and the read-only Docker API only. Internal; apps never join it.
    name: ${IHC_DOCKER_NETWORK:-ihc-docker}
    internal: true

volumes:
  proxy-data:
  proxy-letsencrypt:
  authentik-postgres-data:
  authentik-media:
  authentik-templates:
  authentik-certs:
  postgres-data:
  redis-data:
  gitea-data:
  garage-data:
  gitea-runner-data:
  gitea-deployer-data:
  portainer-data:
  filebrowser-db:
  tailscale-state:
  backup-cache:
