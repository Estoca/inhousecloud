services:
  app:
    build: .
    container_name: inhousecloud-portal-app
    ports:
      - "8016:8006"
    env_file:
      - path: .env
        required: false
    volumes:
      # Pasta do host com o inventario real (apps.json). Nao vai na imagem.
      - ${INVENTORY_DIR:-./inventory}:/app/inventory
      # Pasta onde o job de backup grava o status (latest-status.json). A pagina
      # Plataforma le dali a idade do ultimo backup; BACKUP_MANIFEST_GLOB aponta
      # para /backup-reports/<arquivo>. Somente leitura.
      - ${BACKUP_REPORTS_DIR:-./backup-reports}:/backup-reports:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NODE_ENV: production
      PORT: 8006
      # Dentro do container o Node precisa escutar em todas as interfaces para a
      # porta publicada funcionar. Quem restringe o acesso e a publicacao da porta
      # abaixo e o proxy com forward auth do Authentik. Ver docs/SEGURANCA.md.
      HOST: 0.0.0.0
      # Inventario real, montado do host (volume acima). Nao vai na imagem.
      INVENTORY_PATH: ${INVENTORY_PATH:-/app/inventory/apps.json}
      # Identidade da instalacao (ver .env.example)
      COMPANY_NAME: ${COMPANY_NAME:-Company}
      BASE_DOMAIN: ${BASE_DOMAIN:-cloud.localhost}
      ORG_EMAIL_DOMAINS: ${ORG_EMAIL_DOMAINS:-example.com}
      GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:-http://git.cloud.localhost}
      GITEA_ORG: ${GITEA_ORG:-company}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      AUTHENTIK_URL: ${AUTHENTIK_URL:-http://auth.cloud.localhost}
      OUTPOST_HOST: ${OUTPOST_HOST:-authentik-server}
      OUTPOST_PORT: ${OUTPOST_PORT:-9000}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-proxy}
      DEPLOY_ROOT: ${DEPLOY_ROOT:-/opt/inhousecloud/apps}
      PORT_RANGE: ${PORT_RANGE:-8100-8999}
      TIMEZONE: ${TIMEZONE:-UTC}
      MANIFEST_FILENAME: ${MANIFEST_FILENAME:-company-app.yaml}
      MANIFEST_FILENAME_ALIASES: ${MANIFEST_FILENAME_ALIASES:-app.yaml}
      PLATFORM_PG_READONLY_URL: ${PLATFORM_PG_READONLY_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      # Cache das telas de status (README, "Cache das telas de status"). Sem URL,
      # cache em memoria do container. Prefixo deploy-platform: no Redis compartilhado.
      STATUS_CACHE_REDIS_URL: ${STATUS_CACHE_REDIS_URL:-}
      STATUS_CACHE_TTL_SECONDS: ${STATUS_CACHE_TTL_SECONDS:-300}
      PLATFORM_STATUS_TTL_SECONDS: ${PLATFORM_STATUS_TTL_SECONDS:-60}
      STATUS_CACHE_REDIS_TIMEOUT_MS: ${STATUS_CACHE_REDIS_TIMEOUT_MS:-1500}
      # Credencial exclusiva do provider de catálogo consumido pelo mcp-gateway.
      # Sem ela, as rotas /api/internal/mcp/v1/* permanecem fechadas.
      CATALOG_MCP_TOKEN: ${CATALOG_MCP_TOKEN:-}
      CLOUDFLARED_CONTAINER: ${CLOUDFLARED_CONTAINER:-cloudflared}
      GITEA_RUNNER_CONTAINER: ${GITEA_RUNNER_CONTAINER:-gitea-runner}
      BACKUP_MANIFEST_GLOB: ${BACKUP_MANIFEST_GLOB:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      PORTAINER_URL: ${PORTAINER_URL:-http://portainer.cloud.localhost}
      GLANCES_URL: ${GLANCES_URL:-http://monitor.cloud.localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://portal.cloud.localhost}
      NPM_URL: ${DOCKER_NPM_URL:-http://host.docker.internal:81}
      NPM_EMAIL: ${NPM_EMAIL:-}
      NPM_PASSWORD: ${NPM_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://s3.cloud.localhost}
      GITEA_URL: ${DOCKER_GITEA_URL:-http://host.docker.internal:3007}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      DISK_USAGE_SNAPSHOT_ENABLED: ${DISK_USAGE_SNAPSHOT_ENABLED:-true}
      DISK_USAGE_SNAPSHOT_HOUR: ${DISK_USAGE_SNAPSHOT_HOUR:-3}
      DISK_USAGE_SNAPSHOT_MINUTE: ${DISK_USAGE_SNAPSHOT_MINUTE:-0}
      DISK_USAGE_SNAPSHOT_TIMEZONE: ${DISK_USAGE_SNAPSHOT_TIMEZONE:-UTC}
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8006/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
