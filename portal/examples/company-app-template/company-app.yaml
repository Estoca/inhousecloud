schema_version: 1

app:
  slug: company-app-template
  name: Company App Template
  owner_email: platform@example.com
  description: Template oficial para apps internos publicados em cloud.localhost.

runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: app
  healthcheck:
    type: http
    path: /health
    expected_status: 200

deploy:
  enabled: true
  domain: template.cloud.localhost
  port: auto
  env_file: .env
  env_example: .env.example

auth:
  required: true
  provider: authentik
  allowed_domains:
    - example.com

mcp:
  audience: company-app-template.mcp
  tools_path: /mcp/tools
  execute_path: /mcp/tools/{tool}/execute
  scopes:
    company-app-template.read: [ihc-users]

database:
  required: false
  engine: postgres

checks:
  build_command: docker compose build
  test_command: npm test
