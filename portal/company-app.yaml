# The portal's own manifest (docs/app-contract.md of the cloud). The portal is a core
# service of the cloud, not an app of ihc-app: install.sh builds it from portal/ and starts
# it with the core, before Gitea exists, so nothing deploys it by push (deploy.enabled is
# false). The catalog reads this file to show the portal in its own list
# (src/inventory.js, portalCoreApp).
schema_version: 1

app:
  slug: portal
  name: Portal
  owner_email: admin@example.com
  description: "Catalog, app health and SSO, deploys and platform status of the cloud. Read only."

runtime:
  type: core-service
  service: portal
  port: 8080
  healthcheck:
    type: http
    path: /health
    expected_status: 200

deploy:
  enabled: false
  reason: "Core service of the cloud: install.sh builds and starts it with the core, not a push."
  domain: portal.cloud.localhost
  port: auto

auth:
  required: true
  provider: forward-auth

database:
  required: true
  engine: postgres
