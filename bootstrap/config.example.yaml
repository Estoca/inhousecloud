# Open Company App Harness: installer input for `install.sh --non-interactive --config <file>`.
# Every value here is a default or a placeholder. Secrets are never written in this file:
# the *_env keys name the environment variable the installer reads them from, and the
# installer generates any that are missing into .env (mode 0600).
schema_version: 1

install:
  directory: /opt/open-company-harness
  state_file: state.json
  non_interactive: true
  profile:
    core: true          # always on
    storage: false      # Garage: S3-compatible object storage for apps (a bucket and key per app)
    ops: false          # admin tools: Portainer, Glances, web terminal, file browser (the
                        # interactive installer recommends them; admins only, docs/security.md)

ingress:
  mode: local                    # local | private | public (see docs/install-design.md for the valid matrix)
  base_domain: harness.localhost
  public_base_url: http://portal.harness.localhost
  tls_mode: "off"                # off | internal | edge | acme (quoted: a bare off is YAML for false)
  tunnel_provider: none          # none | tailscale | cloudflared
  cloudflared:
    tunnel_token_env: HARNESS_CLOUDFLARED_TUNNEL_TOKEN
  tailscale:
    hostname: harness
    private_dns_zone: apps.internal

admin:
  email: admin@example.com
  display_name: Platform Admin

authentik:
  bootstrap_email: admin@example.com
  bootstrap_password_env: HARNESS_AUTHENTIK_BOOTSTRAP_PASSWORD
  bootstrap_token_env: HARNESS_AUTHENTIK_BOOTSTRAP_TOKEN
  portal_group: harness-admins
  app_group: harness-users

gitea:
  base_url: http://git.harness.localhost
  initial_admin_username: admin
  initial_admin_password_env: HARNESS_GITEA_ADMIN_PASSWORD
  organization: company
  enable_actions: true
  oidc_enabled: true

postgres:
  shared:                        # for apps built inside the cloud
    enabled: true
  portal:                        # core tools own their database on the shared instance
    database: harness_platform
    role: harness_platform
    password_env: HARNESS_PLATFORM_DATABASE_PASSWORD
  gitea:
    database: gitea
    role: gitea
    password_env: HARNESS_GITEA_DATABASE_PASSWORD
  authentik:                     # identity never depends on app data
    database: authentik
    role: authentik
    password_env: HARNESS_AUTHENTIK_DATABASE_PASSWORD

redis:
  shared:
    enabled: true
  authentik:
    enabled: true

storage:
  provider: none                 # none | garage (install.profile.storage: true also turns it on)
  endpoint_public_url: ""        # informative: apps get S3_PUBLIC_ENDPOINT = <scheme>://s3.<base_domain>
  capacity: 100G                 # the node's capacity in Garage's layout (set once, at the first start)
  # Secrets are generated into .env: GARAGE_RPC_SECRET (or HARNESS_GARAGE_RPC_SECRET, 64 hex
  # chars), GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN. None of them ever reaches an app.

portal:
  enabled: true
  domain: portal.harness.localhost
  super_admin_emails:
    - admin@example.com

ci:                              # the Gitea Actions runners are core: always installed
  gitea_runner:
    registration_token_env: HARNESS_GITEA_RUNNER_TOKEN

ops:                             # the ops profile: harness-admins only, through the SSO
  portainer: false
  glances: false
  wetty:                         # web terminal at terminal.<base_domain>: a shell on the HOST
    enabled: true                # installed only when the host runs sshd; never fails the install
    install_key: false           # true: add the dedicated key (<install-dir>/local/wetty/id_ed25519.pub)
                                 # to ~/.ssh/authorized_keys of the user running install.sh.
                                 # false: the handoff prints the one command that does it
    ssh_port:                    # empty: the preflight finds sshd (sshd_config Port, then 22)
  filebrowser:                   # file manager at files.<base_domain>
    paths:                       # the only host paths it sees; ${install_dir} and
                                 # ${backup_destination} are expanded. Refused: the install
                                 # directory itself, apps/ (env files), local/ (keys), .env,
                                 # the restic repository, home directories, system directories
      app_data: ${install_dir}/app-data                 # one directory per app, its /data (rw)
      backup_reports: ${backup_destination}/reports     # backup status and reports (read only)

backup:                          # docs/backup.md
  enabled: true                  # false: no backup container, smoke test 14 skipped
  schedule: "0 2 * * *"          # cron, run by crond inside the backup container
  timezone: UTC                  # of the schedule
  max_run_minutes: 240           # hard timeout: a run past this is killed and recorded as failed
  max_age_hours: 26              # verify/status call the newest success stale past this
  destination:                   # absolute host directory, ideally another disk or mount;
                                 # empty: <install-dir>/backups (same disk: a warning)
  destination_env: HARNESS_BACKUP_DESTINATION      # this variable, when set, wins over destination
  encryption_key_env: HARNESS_BACKUP_ENCRYPTION_KEY # restic password; generated into .env when unset
  local_retention_daily: 7
  local_retention_weekly: 4
  local_retention_monthly: 12
  remote:                        # off-site copy: not implemented yet (docs/backup.md, "Next")
    provider: none
  restore_test:                  # monthly restore rehearsal: not implemented yet
    enabled: false
    schedule: "0 4 1 * *"
